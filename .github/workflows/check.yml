name: Check
on:
  pull_request:
  push:
    branches: [claude/8-80-prompt-v3-f9tk4m]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: eight80_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/eight80_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run design:test -- --grep-invert @visual
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: output/playwright/
          retention-days: 7
  visual-regression:
    # Match the OS and architecture used to review the committed baselines.
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DESIGN_VISUAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run design:check
      - run: npm run design:test -- --project=chromium --grep @visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: output/playwright/
          retention-days: 7
